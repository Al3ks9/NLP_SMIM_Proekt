[project]
name = "nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "classla>=2.2.1",
    "networkx>=3.4.2",
    "python-louvain>=0.16",
    "pyvis>=0.3.2",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.6.0",
    "transformers>=5.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
